<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gadbride — Coming Soon</title>
  <meta name="description" content="Gadbride — A world of unparalleled luxury is arriving. Stay tuned for something extraordinary." />
  <meta property="og:title" content="Gadbride — Coming Soon" />
  <meta property="og:description" content="A world of unparalleled luxury is arriving soon." />
  <meta property="og:url" content="https://gadbride.com" />
  
  <!-- Added Favicon -->
  <link rel="icon" type="image/png" href="favicon.png" />
  
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300;1,400&family=Cinzel:wght@400;600;700;900&family=Cinzel+Decorative:wght@400;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --gold-light: #f5d67b;
      --gold:       #c9a84c;
      --gold-dark:  #8b6914;
      --gold-shine: #ffe9a0;
      --bg-dark:    #0a0705;
      --cream:      #f5ead8;
    }
    html, body { width: 100%; height: 100%; overflow: hidden; }
    body { background: var(--bg-dark); font-family: 'Cormorant Garamond', serif; position: relative; }

    .bg-layer {
      position: fixed; inset: 0;
      background-image: url('bg.jpg?v=2');
      background-color: #1a1511;
      background-position: center center;
      background-size: cover;
      background-repeat: no-repeat;
      filter: brightness(0.6) saturate(0.9);
      transform: scale(1.05);
      animation: bgBreath 12s ease-in-out infinite;
      z-index: 0;
    }
    @keyframes bgBreath {
      0%,100% { transform: scale(1.05); filter: brightness(0.6) saturate(0.9); }
      50%      { transform: scale(1.10); filter: brightness(0.7) saturate(1.1); }
    }

    .vignette {
      position: fixed; inset: 0;
      background: radial-gradient(ellipse 70% 60% at 50% 50%, transparent 0%, rgba(5,3,1,0.65) 65%, rgba(5,3,1,0.95) 100%);
      z-index: 1;
    }

    .particles { position: fixed; inset: 0; z-index: 2; pointer-events: none; overflow: hidden; }
    .particle {
      position: absolute; border-radius: 50%;
      background: radial-gradient(circle, var(--gold-shine) 0%, var(--gold) 50%, transparent 80%);
      animation: floatUp linear infinite; opacity: 0;
    }
    @keyframes floatUp {
      0%   { transform: translateY(100vh) translateX(0) scale(0); opacity: 0; }
      10%  { opacity: 1; }
      90%  { opacity: 0.6; }
      100% { transform: translateY(-10vh) translateX(var(--drift)) scale(1); opacity: 0; }
    }

    .rays { position: fixed; inset: 0; z-index: 2; pointer-events: none; overflow: hidden; }
    .ray {
      position: absolute; top: 0; left: 50%; width: 1px; height: 55vh;
      transform-origin: top center;
      background: linear-gradient(to bottom, rgba(201,168,76,0.25), transparent);
      animation: rayPulse ease-in-out infinite;
    }
    @keyframes rayPulse {
      0%,100% { opacity: 0.2; }
      50%      { opacity: 0.7; }
    }

    .ornament-top, .ornament-bottom {
      position: fixed; left: 50%; transform: translateX(-50%);
      z-index: 4; pointer-events: none; opacity: 0;
      animation: fadeIn 2s ease forwards;
    }
    .ornament-top    { top: 2vh; animation-delay: 1.5s; }
    .ornament-bottom { bottom: 2vh; animation-delay: 1.8s; transform: translateX(-50%) scaleY(-1); }

    .stage {
      position: relative; z-index: 5; width: 100%; height: 100vh;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 0; padding: 2rem;
    }

    .logo-wrap { position: relative; margin-bottom: 0.6rem; opacity: 0; animation: revealDown 1.4s cubic-bezier(0.22,1,0.36,1) 0.3s forwards; }
    .logo-wrap img {
      height: clamp(200px, 38vh, 420px); width: auto; max-width: 90vw;
      display: block; margin: 0 auto;
      filter: drop-shadow(0 0 20px rgba(201,168,76,0.9)) drop-shadow(0 0 50px rgba(201,168,76,0.6));
      animation: logoGlow 4s ease-in-out infinite;
    }
    @keyframes logoGlow {
      0%,100% {
        filter: drop-shadow(0 0 20px rgba(201,168,76,0.9))
                drop-shadow(0 0 50px rgba(201,168,76,0.6))
                drop-shadow(0 0 90px rgba(201,168,76,0.3));
      }
      50% {
        filter: drop-shadow(0 0 40px rgba(255,220,100,1))
                drop-shadow(0 0 80px rgba(201,168,76,0.8))
                drop-shadow(0 0 140px rgba(201,168,76,0.5))
                drop-shadow(0 0 200px rgba(180,130,20,0.3));
      }
    }

    .divider { display: flex; align-items: center; gap: 1rem; margin: 1.4rem 0; opacity: 0; animation: fadeIn 1.5s ease 1.2s forwards; }
    .divider-line { width: clamp(80px,15vw,200px); height: 1px; background: linear-gradient(to right, transparent, var(--gold), transparent); }
    .divider-diamond {
      width: 8px; height: 8px; background: var(--gold); transform: rotate(45deg);
      box-shadow: 0 0 12px var(--gold-shine);
      animation: diamondPulse 2s ease-in-out infinite;
    }
    @keyframes diamondPulse {
      0%,100% { box-shadow: 0 0 8px var(--gold); transform: rotate(45deg) scale(1); }
      50%      { box-shadow: 0 0 24px var(--gold-shine), 0 0 48px rgba(201,168,76,0.4); transform: rotate(45deg) scale(1.4); }
    }

    .coming-soon-wrap { text-align: center; opacity: 0; animation: revealUp 1.6s cubic-bezier(0.22,1,0.36,1) 1.0s forwards; }
    .coming-soon {
      font-family: 'Cinzel', serif; font-size: clamp(1rem,3.5vw,2.2rem); font-weight: 400;
      letter-spacing: 0.55em; text-transform: uppercase; color: var(--gold-light);
      text-shadow: 0 0 20px rgba(201,168,76,0.8), 0 0 60px rgba(201,168,76,0.3);
      animation: textFlicker 8s ease-in-out infinite; padding-right: 0.55em;
    }
    @keyframes textFlicker {
      0%,92%,96%,100% { opacity: 1; }
      94%              { opacity: 0.7; }
    }
    .coming-soon span { display: inline-block; animation: letterFloat 3s ease-in-out infinite; }
    @keyframes letterFloat {
      0%,100% { transform: translateY(0); }
      50%      { transform: translateY(-4px); }
    }

    .tagline {
      font-family: 'Cormorant Garamond', serif; font-style: italic; font-weight: 300;
      font-size: clamp(0.9rem,2.2vw,1.4rem); letter-spacing: 0.12em; color: rgba(245,234,216,0.65);
      margin-top: 1.4rem; opacity: 0; animation: fadeIn 2s ease 2s forwards;
    }

    .countdown-wrap {
      display: flex; gap: clamp(1rem,4vw,3rem); margin-top: 2.4rem;
      opacity: 0; animation: revealUp 1.4s cubic-bezier(0.22,1,0.36,1) 1.8s forwards;
    }
    .count-box { display: flex; flex-direction: column; align-items: center; gap: 0.3rem; }
    .count-number {
      font-family: 'Cinzel', serif; font-size: clamp(2rem,5vw,4rem); font-weight: 600; line-height: 1;
      color: transparent;
      background: linear-gradient(180deg, var(--gold-shine) 0%, var(--gold) 60%, var(--gold-dark) 100%);
      -webkit-background-clip: text; background-clip: text;
      min-width: 2ch; text-align: center;
      transition: transform 0.3s cubic-bezier(0.34,1.56,0.64,1), opacity 0.3s;
    }
    .count-number.flip { transform: rotateX(90deg); opacity: 0; }
    .count-label { font-family: 'Cinzel', serif; font-size: clamp(0.5rem,1.2vw,0.7rem); letter-spacing: 0.4em; text-transform: uppercase; color: var(--gold-dark); padding-right: 0.4em; }
    .count-separator { font-family: 'Cinzel', serif; font-size: clamp(1.5rem,3.5vw,3rem); color: var(--gold-dark); align-self: flex-start; padding-top: 0.1em; animation: sepBlink 1s step-end infinite; }
    @keyframes sepBlink { 0%,100% { opacity: 1; } 50% { opacity: 0.2; } }

    .notify-wrap { margin-top: 2.4rem; display: flex; flex-direction: column; align-items: center; gap: 0.8rem; opacity: 0; animation: fadeIn 2s ease 2.4s forwards; }
    .notify-label { font-family: 'Cormorant Garamond', serif; font-size: clamp(0.8rem,1.8vw,1.1rem); letter-spacing: 0.2em; color: rgba(201,168,76,0.7); text-transform: uppercase; }
    .notify-form {
      display: flex; gap: 0; border: 1px solid rgba(201,168,76,0.35);
      overflow: hidden; background: rgba(10,7,5,0.6); backdrop-filter: blur(8px);
      box-shadow: 0 0 30px rgba(201,168,76,0.08), inset 0 0 30px rgba(0,0,0,0.3);
      transition: box-shadow 0.4s ease, border-color 0.4s ease;
    }
    .notify-form:focus-within { border-color: rgba(201,168,76,0.7); box-shadow: 0 0 40px rgba(201,168,76,0.2), inset 0 0 20px rgba(0,0,0,0.4); }
    .notify-input {
      background: transparent; border: none; outline: none;
      padding: 0.75rem 1.5rem; font-family: 'Cormorant Garamond', serif;
      font-size: 1rem; letter-spacing: 0.08em; color: var(--cream);
      width: clamp(200px,35vw,360px);
    }
    .notify-input::placeholder { color: rgba(245,234,216,0.3); }
    .notify-btn {
      background: linear-gradient(135deg, var(--gold-dark), var(--gold), var(--gold-dark));
      background-size: 200% 200%; border: none; cursor: pointer;
      padding: 0.75rem 1.6rem; font-family: 'Cinzel', serif;
      font-size: 0.7rem; letter-spacing: 0.3em; text-transform: uppercase;
      color: var(--bg-dark); font-weight: 600;
      transition: background-position 0.4s ease, transform 0.2s ease;
    }
    .notify-btn:hover { background-position: 100% 50%; transform: scale(1.02); }
    .notify-btn:active { transform: scale(0.98); }
    .notify-btn:disabled { opacity: 0.7; cursor: not-allowed; }

    .success-msg { display: none; font-family: 'Cormorant Garamond', serif; font-style: italic; color: var(--gold-light); font-size: 1.1rem; letter-spacing: 0.1em; animation: fadeIn 0.6s ease; }

    /* Social Buttons */
    .social-wrap {
      display: flex;
      align-items: center;
      gap: 1.2rem;
      margin-top: 1.2rem;
    }
    .social-link {
      position: relative;
      display: flex;
      align-items: center;
      gap: 0.65rem;
      padding: 0.6rem 1.4rem;
      border: 1px solid rgba(201,168,76,0.28);
      text-decoration: none;
      color: var(--gold);
      font-family: 'Cinzel', serif;
      font-size: 0.58rem;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      background: rgba(10, 7, 5, 0.45);
      backdrop-filter: blur(8px);
      overflow: hidden;
      transition: all 0.45s cubic-bezier(0.22, 1, 0.36, 1);
    }
    .social-link::before {
      content: '';
      position: absolute; inset: 0;
      background: linear-gradient(135deg, rgba(201,168,76,0.12) 0%, rgba(201,168,76,0.04) 100%);
      opacity: 0;
      transition: opacity 0.45s ease;
    }
    .social-link::after {
      content: '';
      position: absolute;
      bottom: 0; left: 0;
      width: 0; height: 1px;
      background: linear-gradient(90deg, var(--gold-dark), var(--gold-shine), var(--gold-dark));
      transition: width 0.5s cubic-bezier(0.22, 1, 0.36, 1);
    }
    .social-link:hover::before { opacity: 1; }
    .social-link:hover::after { width: 100%; }
    .social-link:hover {
      border-color: rgba(201,168,76,0.6);
      color: var(--gold-shine);
      box-shadow: 0 0 28px rgba(201,168,76,0.18), inset 0 0 18px rgba(201,168,76,0.06);
      transform: translateY(-3px);
    }
    .social-link svg {
      width: 15px; height: 15px;
      fill: currentColor;
      flex-shrink: 0;
      position: relative; z-index: 1;
      transition: transform 0.4s ease;
    }
    .social-link:hover svg { transform: scale(1.12) rotate(-4deg); }
    .social-link span { position: relative; z-index: 1; }

    .corner { position: fixed; z-index: 3; width: clamp(60px,10vw,120px); height: clamp(60px,10vw,120px); opacity: 0; animation: fadeIn 2s ease 2s forwards; }
    .corner-tl { top: 1.5rem; left: 1.5rem; }
    .corner-tr { top: 1.5rem; right: 1.5rem; transform: scaleX(-1); }
    .corner-bl { bottom: 1.5rem; left: 1.5rem; transform: scaleY(-1); }
    .corner-br { bottom: 1.5rem; right: 1.5rem; transform: scale(-1,-1); }

    .domain-badge { position: fixed; bottom: 2.5rem; left: 2.5rem; z-index: 6; font-family: 'Cinzel', serif; font-size: 0.65rem; letter-spacing: 0.3em; color: rgba(201,168,76,0.4); text-transform: uppercase; opacity: 0; animation: fadeIn 2s ease 3s forwards; }

    .scanline { position: fixed; inset: 0; z-index: 3; background: repeating-linear-gradient(to bottom, transparent, transparent 3px, rgba(0,0,0,0.03) 3px, rgba(0,0,0,0.03) 4px); pointer-events: none; }

    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    @keyframes revealDown { from { opacity: 0; transform: translateY(-40px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes revealUp { from { opacity: 0; transform: translateY(40px); } to { opacity: 1; transform: translateY(0); } }

    @media (max-height: 600px) { .logo-wrap img { height: 70px; } .tagline { display: none; } .notify-wrap { margin-top: 1rem; } }
    @media (max-width: 480px) {
      .notify-input { width: 200px; }
      .count-separator { display: none; }
      .countdown-wrap { gap: 1.4rem; }
      .domain-badge { display: none; }
      .social-wrap { flex-wrap: wrap; justify-content: center; }
      .social-link { padding: 0.6rem 1rem; }
    }
  </style>
</head>

  <div class="domain-badge">gadbride.com</div>

  <script>
    // --- Logo Fallback Logic ---
    var logoImg = document.getElementById('logo-img');
    logoImg.onerror = function() {
      this.style.display = 'none';
      var wrap = this.closest('.logo-wrap');
      var svg = document.createElementNS('http://www.w3.org/2000/svg','svg');
      svg.setAttribute('viewBox','0 0 200 120');
      svg.setAttribute('width','180');
      svg.setAttribute('height','108');
      svg.style.filter = 'drop-shadow(0 0 30px rgba(201,168,76,0.7))';
      svg.innerHTML = '<defs><linearGradient id="ggrad" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" style="stop-color:#8b6914"/><stop offset="40%" style="stop-color:#c9a84c"/><stop offset="60%" style="stop-color:#ffe9a0"/><stop offset="100%" style="stop-color:#8b6914"/></linearGradient></defs><text x="100" y="90" text-anchor="middle" font-family="Cinzel Decorative,serif" font-size="70" font-weight="700" fill="url(#ggrad)">G</text>';
      wrap.appendChild(svg);
    };

    // --- Coming Soon Text Animation ---
    var text = "Coming Soon";
    var el = document.getElementById('coming-soon-text');
    text.split('').forEach(function(ch, i) {
      var span = document.createElement('span');
      span.textContent = ch === ' ' ? '\u00A0' : ch;
      span.style.display = 'inline-block';
      span.style.animation = 'letterFloat ' + (2.5 + (i % 3) * 0.5) + 's ease-in-out ' + (i * 0.08 + 1.4) + 's infinite';
      el.appendChild(span);
    });

    // --- Particle & Ray Effects ---
    var pc = document.getElementById('particles');
    for (var i = 0; i < 35; i++) {
      var p = document.createElement('div');
      p.classList.add('particle');
      var size = Math.random() * 4 + 1;
      p.style.cssText = 'width:'+size+'px;height:'+size+'px;left:'+(Math.random()*100)+'%;--drift:'+((Math.random()-0.5)*200)+'px;animation-duration:'+(Math.random()*12+8)+'s;animation-delay:'+(Math.random()*10)+'s;';
      pc.appendChild(p);
    }

    var rc = document.getElementById('rays');
    for (var j = 0; j < 14; j++) {
      var r = document.createElement('div');
      r.classList.add('ray');
      var angle = -60 + j * (120/13);
      r.style.cssText = 'transform:rotate('+angle+'deg);animation-duration:'+(Math.random()*3+3)+'s;animation-delay:'+(Math.random()*2)+'s;height:'+(40+Math.random()*20)+'vh;';
      rc.appendChild(r);
    }

    // --- Fixed Countdown Logic ---
    // Change this specific date and time to match your exact launch target
    var target = new Date('2026-11-01T00:00:00');
    
    function pad(n) { return String(n).padStart(2,'0'); }
    var prev = {d:-1,h:-1,m:-1,s:-1};
    
    function flip(elem, val, key) {
      if (prev[key] !== val) {
        elem.classList.add('flip');
        setTimeout(function() { elem.textContent = pad(val); elem.classList.remove('flip'); prev[key] = val; }, 200);
      }
    }
    
    function tick() {
      var diff = Math.max(0, target.getTime() - Date.now());
      flip(document.getElementById('cd-days'),    Math.floor(diff/86400000), 'd');
      flip(document.getElementById('cd-hours'),   Math.floor((diff%86400000)/3600000), 'h');
      flip(document.getElementById('cd-minutes'), Math.floor((diff%3600000)/60000), 'm');
      flip(document.getElementById('cd-seconds'), Math.floor((diff%60000)/1000), 's');
    }
    tick(); setInterval(tick, 1000);

    // --- Webhook Email Submission Logic ---
    async function handleNotify(e) {
      e.preventDefault();
      
      var emailInput = document.getElementById('notify-email');
      var submitBtn = document.getElementById('notify-btn');
      
      // Update UI to show loading state
      submitBtn.textContent = "Sending...";
      submitBtn.disabled = true;

      try {
        // Replace this URL with your actual Make.com Webhook URL
        const WEBHOOK_URL = 'YOUR_WEBHOOK_URL_HERE';
        
        await fetch(WEBHOOK_URL, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
          },
          body: JSON.stringify({
            email: emailInput.value,
            source: 'Gadbride Coming Soon',
            timestamp: new Date().toISOString()
          })
        });

        // If successful, hide form and show success message
        document.getElementById('notify-form').style.display = 'none';
        document.getElementById('success-msg').style.display = 'block';
        
      } catch (error) {
        console.error('Submission failed:', error);
        submitBtn.textContent = "Error. Retry";
        submitBtn.disabled = false;
      }
    }

    // --- Mouse Parallax Effect ---
    document.addEventListener('mousemove', function(e) {
      var x = (e.clientX/window.innerWidth - 0.5)*2;
      var y = (e.clientY/window.innerHeight - 0.5)*2;
      document.querySelector('.bg-layer').style.transform = 'scale(1.07) translate('+(x*8)+'px,'+(y*6)+'px)';
      document.getElementById('rays').style.transform = 'translate('+(x*15)+'px,'+(y*10)+'px)';
    });
  </script>
</body>
</html>
